<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Graphify for Claude Code: build a knowledge graph of your project, then ask the graph before grepping">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    text{white-space:pre}
    @keyframes l1{0%,2.99%{opacity:0}3%,94%{opacity:1}97%,100%{opacity:0}}
    .l1{animation:l1 9s infinite}
    @keyframes l2{0%,13.99%{opacity:0}14%,94%{opacity:1}97%,100%{opacity:0}}
    .l2{animation:l2 9s infinite}
    @keyframes l3{0%,27.99%{opacity:0}28%,94%{opacity:1}97%,100%{opacity:0}}
    .l3{animation:l3 9s infinite}
    @keyframes l4{0%,45.99%{opacity:0}46%,94%{opacity:1}97%,100%{opacity:0}}
    .l4{animation:l4 9s infinite}
    @keyframes l5{0%,55.99%{opacity:0}56%,94%{opacity:1}97%,100%{opacity:0}}
    .l5{animation:l5 9s infinite}
    @keyframes l6{0%,67.99%{opacity:0}68%,94%{opacity:1}97%,100%{opacity:0}}
    .l6{animation:l6 9s infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .n{animation:pulse 3s ease-in-out infinite}
    .n2{animation-delay:.6s} .n3{animation-delay:1.2s} .n4{animation-delay:1.8s} .n5{animation-delay:2.4s}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .cur{animation:blink 1s steps(1) infinite}
    @media (prefers-reduced-motion: reduce){ [class^="l"],.n,.cur{animation:none;opacity:1} }
  </style>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <text x="80" y="92" fill="#22d3ee" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" letter-spacing="4">CLAUDE CODE PLUGIN</text>
  <text x="76" y="182" fill="#ffffff" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800">Graphify</text>
  <rect x="80" y="204" width="132" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="256" fill="#c7cbe0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26">Ask the graph before you grep.</text>
  <text x="80" y="292" fill="#8b90ad" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20">Code · docs · papers · images · video → one knowledge graph</text>
  <g stroke="#2c3363" stroke-width="2">
    <line x1="92" y1="344" x2="168" y2="330"/><line x1="168" y1="330" x2="238" y2="352"/>
    <line x1="168" y1="330" x2="214" y2="312"/><line x1="238" y1="352" x2="312" y2="336"/>
    <line x1="214" y1="312" x2="312" y2="336"/><line x1="312" y1="336" x2="384" y2="348"/>
  </g>
  <g>
    <circle class="n" cx="92" cy="344" r="7" fill="#7c5cff"/>
    <circle class="n n2" cx="168" cy="330" r="10" fill="#22d3ee"/>
    <circle class="n n3" cx="214" cy="312" r="6" fill="#e15759"/>
    <circle class="n n4" cx="238" cy="352" r="7" fill="#76b7b2"/>
    <circle class="n n5" cx="312" cy="336" r="9" fill="#7c5cff"/>
    <circle class="n n3" cx="384" cy="348" r="6" fill="#22d3ee"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">
    <g transform="translate(690 60)">
      <rect width="440" height="290" rx="14" fill="#0f1530" stroke="#2c3363"/>
      <circle cx="22" cy="22" r="6" fill="#ff5f57"/><circle cx="42" cy="22" r="6" fill="#febc2e"/><circle cx="62" cy="22" r="6" fill="#28c840"/>
      <text class="l1" x="22" y="70" fill="#22d3ee">&gt; /graphify .</text>
      <text class="l2" x="22" y="96" fill="#e6e8f2">  1,032 nodes · 58 communities</text>
      <text class="l3" x="22" y="136" fill="#22d3ee">&gt; graphify query</text>
      <text class="l3" x="22" y="160" fill="#e6e8f2">  "how are hooks installed for claude"</text>
      <g class="l4">
        <rect x="22" y="176" width="396" height="32" rx="8" fill="#1b2350" stroke="#7c5cff"/>
        <text x="36" y="198" fill="#ffffff">claude_install()   install.py:2385</text>
      </g>
      <g class="l5">
        <rect x="22" y="214" width="396" height="32" rx="8" fill="#1b2350" stroke="#2c3363"/>
        <text x="36" y="236" fill="#ffffff">claude_uninstall() install.py:2564</text>
      </g>
      <text class="l6" x="22" y="272" fill="#28c840">✓ answered from the graph<tspan class="cur" fill="#e6e8f2"> ▌</tspan></text>
    </g>
  </g>
</svg>
